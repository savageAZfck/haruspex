[package]
name = "haruspex-macho"
version = "0.2.0"
edition = "2021"
rust-version = "1.75"
authors = ["Adam Clark <savagetism@icloud.com>"]
repository = "https://github.com/savageAZfck/haruspex"
homepage = "https://github.com/savageAZfck/haruspex"
license = "MIT"
description = "Read the entrails of binaries: pure-Rust Mach-O inspection (slices, load commands, dylibs, symbols, entitlements, strings) with evidence-backed audit reports. Read-only — never executes the target. Named for the haruspices."
keywords = ["mach-o", "binary-analysis", "reverse-engineering", "audit", "agent"]
categories = ["parser-implementations"]
readme = "README.md"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"

[features]
default = []
